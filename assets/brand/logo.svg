<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- FolderTags logo. Palette = src/tags.cpp (blue 388AF0, yellow F7CB3F, red F0524F). -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2AE16"/>
      <stop offset="1" stop-color="#D98A00"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDC6E"/>
      <stop offset="1" stop-color="#FFBA2B"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9ECF2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset=".12" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="dotShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#7A4A00" flood-opacity=".35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- back plate with tab -->
    <path d="M20 62a22 22 0 0 1 22-22h52c6.4 0 11 2.2 15.2 6.6L122 60h92a22 22 0 0 1 22 22v118H20z" fill="url(#back)"/>
    <!-- paper sheet peeking out -->
    <rect x="38" y="70" width="180" height="60" rx="8" fill="url(#paper)"/>
    <!-- front flap -->
    <rect x="20" y="92" width="216" height="128" rx="20" fill="url(#front)"/>
    <rect x="20" y="92" width="216" height="128" rx="20" fill="url(#sheen)"/>
    <rect x="20.75" y="92.75" width="214.5" height="126.5" rx="19.25" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="1.5"/>
  </g>

  <!-- Tags mark: three overlapping haloed dots, same order as PaintRootIcon -->
  <g filter="url(#dotShadow)">
    <circle cx="96"  cy="158" r="31" fill="#FFFFFF"/>
    <circle cx="96"  cy="158" r="25" fill="#388AF0"/>
    <circle cx="128" cy="158" r="31" fill="#FFFFFF"/>
    <circle cx="128" cy="158" r="25" fill="#F7CB3F"/>
    <circle cx="160" cy="158" r="31" fill="#FFFFFF"/>
    <circle cx="160" cy="158" r="25" fill="#F0524F"/>
  </g>
</svg>
